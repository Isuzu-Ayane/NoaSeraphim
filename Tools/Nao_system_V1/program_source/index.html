<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nao Seraphim Local System</title>

  <link rel="stylesheet" href="./src/styles.css">
</head>

<body>
  <div class="app-container">
    <nav class="sidebar">
      <h2>👼 Nao System</h2>
      <button id="btn-settings">⚙️ APIキー設定</button>
      <button id="btn-context">🧠 コンテキスト設定</button>
      <button id="btn-bg">🌌 背景変更</button>
      <div class="history-list">
        <p class="history-title">■ 通信ログ</p>
      </div>
    </nav>

    <main class="main-content">
      <div id="chat-box" class="chat-box">
        <div class="message nao-msg" style="color: #555; font-family: monospace;">
          [SYSTEM INFO] ローカルアシスタントが起動しました。<br>
          待機中です。メッセージを入力するか、左のメニューからコンテキスト設定を行ってください。
        </div>
      </div>

      <div class="input-area">
        <input type="text" id="user-input" placeholder="メッセージを入力..." />
        <button id="btn-send">送信</button>
      </div>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 id="modal-title">設定</h3>

      <textarea id="modal-input" rows="5" placeholder="ここに入力..."></textarea>

      <div id="bg-options" style="display: none; flex-direction: column; gap: 15px; margin-top: 10px;">
        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
          <label style="font-weight: bold; color: #333; display: block; margin-bottom: 8px;">🎨 単色で塗りつぶす</label>
          <input type="color" id="bg-color"
            style="width: 100%; height: 40px; cursor: pointer; border: none; padding: 0;">
        </div>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
          <label style="font-weight: bold; color: #333; display: block; margin-bottom: 8px;">🖼️ 好きな画像を背景にする</label>
          <input type="file" id="bg-file" accept="image/*" style="width: 100%;">
          <p style="font-size: 0.8em; color: #666; margin-top: 5px; margin-bottom: 0;">※画像を選ぶと、上の色より優先されるだて！</p>
        </div>
      </div>

      <div class="modal-buttons">
        <button id="btn-save">保存</button>
        <button id="btn-close">キャンセル</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
